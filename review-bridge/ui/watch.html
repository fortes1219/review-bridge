<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="review-bridge-session" content="__SESSION_TOKEN__">
<title>Review Bridge 設定檢查</title>
<link rel="stylesheet" href="/watch.css">
</head>
<body>
<main>
  <h1>Review Bridge 設定檢查</h1>
  <p class="note">開啟或重新整理此頁不會呼叫任何模型，只會在本機檢查 CLI 是否安裝與登入。</p>

  <section>
    <h2>角色</h2>
    <dl id="roles"><dt>載入中…</dt></dl>
    <button type="button" id="refresh">重新檢查（不使用模型）</button>
  </section>

  <section>
    <h2>Reviewer 是否無法寫檔</h2>
    <p id="readonly-state">尚未檢查。</p>
    <p class="note">檢查結果只保存在這次執行中的 watch 程式記憶體；關閉或重新啟動 watch 後會回到「尚未檢查」。此頁的按鈕不代表人類授權。</p>
    <p class="cost" id="cost-notice"><strong>注意：</strong>按下下方按鈕會花費一次模型呼叫。Bridge 會在一個臨時空資料夾裡，請 reviewer 嘗試寫入一個檔案，並確認唯讀沙箱確實擋下。每次按下最多一次呼叫，失敗也不會自動重試。</p>
    <button type="button" id="probe" disabled>將使用一次模型呼叫確認 reviewer 無法寫入</button>
    <p id="probe-result" role="status"></p>
  </section>

  <section>
    <h2>能不能開始實際工作</h2>
    <p id="native-state">還不能。開始實際工作需要人類授權驗證，這一步尚未提供。</p>
  </section>
</main>
<script src="/watch.js"></script>
</body>
</html>
